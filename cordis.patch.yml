# dsh-ima — DSH 插件挂载行
#
# 一行 `- insert:`：把本包入口按【包名】插进组合树。
# 为什么必须写 `name` = 本包包名：DSH 的 patch 行按包名（而不是相对路径）引用包，
# 这样 Node 的模块解析才能找到已安装的代码；`package.json#main` 不会因为包被列进
# profile 的 bundles 就自动执行。缺这一行 = 入口不被 import = 工具一个都不注册。
#
# 默认配置：全部留空，装好后点左侧栏的「ima」图标，在弹出的页面里填 Client ID / API Key 即可。
# 也支持改这里（或改 profile 的 cordis.patch.yml 同 id 行）；非法值会在加载期直接报错。
- insert:
    - id: dsh-ima
      name: dsh-ima
      config:
        http:
          preset: ima
